<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Data model graph</title>
<style>body{margin:0;font:13px system-ui,sans-serif;background:#fafafa}header{padding:8px 12px;border-bottom:1px solid #ddd;background:#fff}
svg{width:100vw;height:calc(100vh - 42px);cursor:grab}.node rect{rx:6;stroke-width:1.5}.dim{opacity:.15}.edge{stroke:#6b7280;stroke-width:1.5;fill:none}
.lbl{fill:#374151;font-size:11px}.legend span{display:inline-block;padding:2px 6px;margin-left:8px;border-radius:4px}</style></head>
<body><header><strong id="t"></strong><span class="legend"><span style="background:#2f6feb;color:#fff">new / changed</span><span style="background:#e5e7eb">existing</span></span> — drag to pan, wheel to zoom, click a node to focus</header>
<svg id="s"><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6b7280"/></marker></defs><g id="v"></g></svg>
<script>
const G = {"title":"Access framework and authentication security foundation — 2026-10-20-access-framework.md","nodes":[{"id":"entity_1","label":"User (users)","kind":"new","x":320,"y":200,"fields":["id uuid","email unique","display_name","+ role mentee|mentor (operator derived)"]},{"id":"entity_2","label":"AuthSession (auth_sessions)","kind":"new","x":20,"y":0,"fields":["user_id FK cascade","token_hash unique","idle_expires_at","absolute_expires_at","last_seen_at","revoked_at null","method github|password"]},{"id":"entity_3","label":"OneTimeToken (one_time_tokens)","kind":"new","x":640,"y":0,"fields":["purpose","subject","one live token per purpose+subject","token_hash unique","payload jsonb","expires_at","consumed_at null","revoked_at null","created_by FK set null"]},{"id":"entity_4","label":"AuditEvent (audit_events)","kind":"new","x":640,"y":330,"fields":["occurred_at","actor_id FK set null","actor_role","action","target_type / target_id","metadata jsonb"]},{"id":"entity_5","label":"MentorProfile (mentor_profiles)","kind":"existing","x":20,"y":360,"fields":["user_id FK unique cascade","headline"]}],"edges":[{"from":"entity_1","to":"entity_2","label":"1-n"},{"from":"entity_1","to":"entity_3","label":"1-n created_by"},{"from":"entity_1","to":"entity_4","label":"1-n actor"},{"from":"entity_1","to":"entity_5","label":"1-1"}]};
const NS='http://www.w3.org/2000/svg', v=document.getElementById('v'), s=document.getElementById('s');
document.getElementById('t').textContent=G.title;
const pos={}; G.nodes.forEach((n,i)=>{pos[n.id]={x:n.x,y:n.y}});
const el=(tag,attrs)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};
const W=230,H=d=>40+d.fields.length*16;
const edgeEls=[],nodeEls={};
G.edges.forEach(e=>{const a=pos[e.from],b=pos[e.to],na=G.nodes.find(n=>n.id===e.from),nb=G.nodes.find(n=>n.id===e.to);
 const x1=a.x+W/2,y1=a.y+H(na)/2,x2=b.x+W/2,y2=b.y+H(nb)/2;
 const g=el('g',{});const p=el('line',{x1,y1,x2,y2,class:'edge','marker-end':'url(#a)'});const t=el('text',{x:(x1+x2)/2+4,y:(y1+y2)/2-4,class:'lbl'});t.textContent=e.label;
 g.append(p,t);v.append(g);edgeEls.push({g,e});});
G.nodes.forEach(n=>{const g=el('g',{class:'node',transform:'translate('+pos[n.id].x+','+pos[n.id].y+')'});
 const isNew=n.kind==='new';g.append(el('rect',{width:W,height:H(n),fill:isNew?'#2f6feb':'#e5e7eb',stroke:isNew?'#1b4fb0':'#9ca3af'}));
 const tt=el('text',{x:10,y:22,fill:isNew?'#fff':'#111','font-weight':'bold'});tt.textContent=n.label;g.append(tt);
 n.fields.forEach((f,i)=>{const ft=el('text',{x:10,y:42+i*16,fill:isNew?'#dbeafe':'#374151','font-size':'11'});ft.textContent=f;g.append(ft)});
 g.addEventListener('click',ev=>{ev.stopPropagation();focus(n.id)});v.append(g);nodeEls[n.id]=g;});
function focus(id){const keep=new Set([id]);edgeEls.forEach(({g,e})=>{const on=e.from===id||e.to===id;g.classList.toggle('dim',!on);if(on){keep.add(e.from);keep.add(e.to)}});
 for(const k in nodeEls)nodeEls[k].classList.toggle('dim',!keep.has(k));}
s.addEventListener('click',()=>{edgeEls.forEach(({g})=>g.classList.remove('dim'));for(const k in nodeEls)nodeEls[k].classList.remove('dim')});
let tx=20,ty=20,sc=1,drag=null;const apply=()=>v.setAttribute('transform','translate('+tx+','+ty+') scale('+sc+')');apply();
s.addEventListener('mousedown',e=>{drag={x:e.clientX-tx,y:e.clientY-ty}});addEventListener('mouseup',()=>drag=null);
addEventListener('mousemove',e=>{if(drag){tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply()}});
s.addEventListener('wheel',e=>{e.preventDefault();sc=Math.min(3,Math.max(.3,sc*(e.deltaY<0?1.1:.9)));apply()},{passive:false});
</script></body></html>
